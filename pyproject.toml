[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docsync-local"
version = "0.1.0"
description = "Local-first, evidence-grounded documentation updates with human review"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "streamlit==1.65.0",
  "httpx==0.28.1", "pydantic==2.13.5", "watchdog==6.0.0",
  "pathspec==0.12.1", "qdrant-client==1.19.1", "rank-bm25==0.2.2",
  "langgraph==1.2.12", "langgraph-checkpoint-sqlite==3.1.1",
  "mcp==1.30.0", "filelock==3.32.7"
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.10"]

[project.scripts]
docsync = "docsync.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docsync"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
